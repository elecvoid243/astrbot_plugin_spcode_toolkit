name: astrbot_plugin_spcode_toolkit
author: elecvoid243
display_name: spcode 工具箱
version: v2.23.1
description: |
  ## 主要能力

  spcode 工具箱 — 为 LLM Agent 提供面向 C/C++/Python 开发的实用工具集，并配套 39 条
  `/spcode/*` Web API 供 Dashboard 实时消费。

  - **16 个本地 LLM 工具**：code_check / code_format / es_search / file_remove / file_compare /
    todo_create / todo_query / todo_add / todo_update / todo_delete / todo_clear /
    inta_shell_start / inta_shell_send / inta_shell_read / inta_shell_stop / inta_shell_list
  - **codegraph MCP server**（自动启动）：注入 8 个语义搜索工具
    （codegraph_search / callers / callees / impact / node / explore / status / files）
  - **vivado-mcp FPGA 集成** (v2.21+)：注入 21 个 `mcp_vivado__*` 工具
    含 11 个写工具（受 plan 模式保护，需 `/build` 切换后才能调用）
  - **6 个 chat 命令入口**：4 个命令组 `/codegraph`（别名 `/cg`）、`/agentsmd`、`/project`、`/vivado`
    + 2 个独立命令 `/plan`、`/build`（plan/build 模式切换）
  - **39 条 Web API 路由**（`/spcode/*`）：git 工作区状态 / git 历史 / 文件浏览器 /
    git worktree 管理 / docs CRUD / btw 一次性 LLM 请求 / vivado-status 快照 /
    plan-mode 查询与切换

  ## 端点选录

  | 类别 | 代表端点 |
  |------|---------|
  | 项目状态 | `/spcode/project-status`、`/spcode/plan-mode` |
  | Git 工作区 | `/spcode/git-status` / `git-diff` / `git-log` / `git-stats` / `git-show` |
  | Git 工作流 | `/spcode/git-stage` / `git-unstage` / `git-commit` / `git-init` / `git-branch-*` / `git-revert` |
  | Git Worktree | `/spcode/git-worktree-add` / `remove` / `lock` / `unlock` |
  | 文件 | `/spcode/file-browser` / `file-binary` / `file-write` / `file-rename` / `file-remove` / `file-search` |
  | docs 管理 | `/spcode/docs`（POST/PATCH/DELETE） |
  | MCP 状态 | `/spcode/codegraph-status`、`/spcode/vivado-status` |
  | 辅助 | `/spcode/btw`（一次性 LLM 请求，命中 prefix cache） |

  ## 安全

  L1 管理员鉴权：整个 spcode 工具箱是**管理员工具集**。非管理员不可见任何工具
  （含 21 个 `mcp_vivado__*` 写工具与 8 个 `codegraph_*` 读工具）。管理员授权可通过插件配置
  `allowed_ids`（逗号分隔用户 ID）扩展，与 AstrBot 全局管理员并集生效。

  plan/build 模式：默认状态下 LLM 工具列表与 AstrBot 默认行为一致。
  `/plan` 激活后按 `plan_mode_blocked_tools` 配置过滤写工具，仅允许只读工具调研；
  `/build` 恢复全部工具可用。

  ## 前置依赖

  | 能力 | 依赖 | 缺失时行为 |
  |------|------|-----------|
  | code_check / code_format | ruff / cppcheck / cpplint / AStyle | 返回安装提示 |
  | es_search (Windows) | Everything CLI (es.exe) | 返回安装提示 |
  | es_search (Linux/macOS) | locate / fd / Python 兜底 | 自动降级到 `os.walk` |
  | codegraph_* | `@colbymchenry/codegraph` (npm) + 配置 `codegraph_install_dir` | 8 个工具均不出现 |
  | vivado-mcp (v2.21+) | `pip install vivado-mcp` + Vivado IDE 安装 | 21 个工具均不出现；`/vivado` 与 `/spcode/vivado-status` 提示缺失 |

  ## 版本历程（最近 8 个）

  - **v2.23.1** (2026-08-11) code_format 保持原文件编码：`_format_with_astyle` 写回不再固定 UTF-8，复用 `tools/_helpers._decode_text_bytes`（上移自 file-browser）探测原编码（GBK/cp936 仍保持、UTF-8 BOM 保留）；file-browser 改为 re-export
  - **v2.23.0** (2026-08-11) inta_shell 配置项隐藏：AstrBot 官方核心已内置等价交互式 shell 工具（`astrbot_execute_shell` / `astrbot_shell_session`），从 `_conf_schema.json` 移除 `inta_shell` 分组及 `enabled_tools` 选项，运行时固定默认参数；工具注册代码保留（兼容老 config）
  - **v2.22.0** (2026-07-27) `POST /spcode/plan-mode`：dashboard plan/build chip 直调 API 切换模式，不再向聊天框注入 `/plan` `/build` 用户消息（旧版插件自动回退到发命令）
  - **v2.21.1** (2026-07-26) `cppcheck_enable` 配置项（用户多选 warning/style/performance/portability，默认空 = 仅报 error）
  - **v2.21** (2026-07-25) vivado-mcp 集成（9 个新文件、38 Web API 路由、6 状态徽章）
  - **v2.20** (2026-07-17) `POST /spcode/btw` 一次性独立 LLM 请求
  - **v2.18.0** (2026-07-16) `GET /spcode/git-repo-check`（独立 preflight）
  - **v2.17.1** (2026-07-16) `git-init` 支持 `force=true` 在非空目录 init
  - **v2.17.0** (2026-07-15) 8 个 git 端点：init / branches / branch-create / branch-delete / branch-switch / revert
  - **v2.16.0** (2026-07-06) `POST /spcode/file-discard-hunk`（按 hunk 丢弃工作区改动）
  - **v2.15.0** (2026-07-02) `POST /spcode/file-search` + `file-name-search`
  - **v2.14** (2026-06-25) `code_format` 工具（写入；plan 模式默认被过滤）

  详细变更日志见 `README.md` / `AGENTS.md`。

  ## 文档

  - `README.md` — 完整功能说明 + 工具详解 + 端点列表
  - `AGENTS.md` — 给 coding agent 看的项目规范（架构、命令、约束）
  - `docs/superpowers/specs/` — 各端点的设计 spec
  - `docs/api/` — 前端 Dashboard 消费参考

